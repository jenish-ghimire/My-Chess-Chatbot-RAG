version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - env | grep -E "^(MY_AWS_|DATABASE_URL|BEDROCK_|RETRIEVAL_|TOP_K_)" >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
